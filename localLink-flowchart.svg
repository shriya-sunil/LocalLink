<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LocalLink workflow diagram</title>
  <desc id="desc">A LocalLink flowchart showing sign in, request, quotes, booking, service completion, payment, review, and support.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#edf7fb"/>
      <stop offset="100%" stop-color="#dfeef5"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#cfeafc"/>
      <stop offset="100%" stop-color="#9ed0ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4a5e6d" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2c3e50"/>
    </marker>
    <style>
      .title { font: 700 36px 'Segoe UI', Arial, sans-serif; fill: #16324f; }
      .subtitle { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #5b7387; }
      .boxTitle { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #12314a; }
      .boxText { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #14354f; }
      .small { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #2d4a60; }
      .decision { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #16324f; }
      .node { fill: url(#boxGrad); stroke: #1d3d59; stroke-width: 3; rx: 18; }
      .decisionBox { fill: #dff7f6; stroke: #1d3d59; stroke-width: 3; rx: 20; }
      .core { fill: #eaf7ff; stroke: #1d3d59; stroke-width: 3; }
      .arrowLine { stroke: #2c3e50; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .subBox { fill: #f2fbff; stroke: #35617c; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bgGrad)"/>

  <text x="800" y="62" text-anchor="middle" class="title">LocalLink</text>
  <text x="800" y="96" text-anchor="middle" class="subtitle">Neighborhood Services Workflow</text>

  <!-- Top level -->
  <rect x="610" y="130" width="380" height="80" class="node" filter="url(#shadow)"/>
  <text x="800" y="176" text-anchor="middle" class="boxTitle">Requirements File</text>
  <text x="800" y="198" text-anchor="middle" class="small">(Source of Truth)</text>

  <line x1="800" y1="210" x2="800" y2="250" class="arrowLine"/>

  <rect x="640" y="250" width="320" height="80" class="node" filter="url(#shadow)"/>
  <text x="800" y="297" text-anchor="middle" class="boxTitle">Orchestrator Agent</text>
  <text x="800" y="319" text-anchor="middle" class="small">Manager</text>

  <line x1="800" y1="330" x2="800" y2="375" class="arrowLine"/>

  <rect x="330" y="375" width="300" height="80" class="node" filter="url(#shadow)"/>
  <text x="480" y="421" text-anchor="middle" class="boxTitle">Router Conversation</text>
  <text x="480" y="443" text-anchor="middle" class="small">Choose the Right Agent</text>

  <rect x="970" y="375" width="300" height="80" class="node" filter="url(#shadow)"/>
  <text x="1120" y="421" text-anchor="middle" class="boxTitle">Chain Conversation</text>
  <text x="1120" y="443" text-anchor="middle" class="small">Run steps in order</text>

  <!-- Branches -->
  <line x1="630" y1="460" x2="530" y2="510" class="arrowLine"/>
  <line x1="970" y1="460" x2="1065" y2="510" class="arrowLine"/>

  <!-- Customer / Provider / Data -->
  <rect x="60" y="510" width="230" height="105" class="node" filter="url(#shadow)"/>
  <text x="175" y="555" text-anchor="middle" class="boxText">Customer</text>
  <text x="175" y="580" text-anchor="middle" class="small">Sign in / Book service</text>

  <rect x="330" y="510" width="240" height="105" class="node" filter="url(#shadow)"/>
  <text x="450" y="555" text-anchor="middle" class="boxText">Provider</text>
  <text x="450" y="580" text-anchor="middle" class="small">Respond / Quote</text>

  <rect x="620" y="510" width="240" height="105" class="node" filter="url(#shadow)"/>
  <text x="740" y="555" text-anchor="middle" class="boxText">Supabase</text>
  <text x="740" y="580" text-anchor="middle" class="small">Auth + DB + Storage</text>

  <rect x="920" y="510" width="250" height="105" class="node" filter="url(#shadow)"/>
  <text x="1045" y="555" text-anchor="middle" class="boxText">Requests</text>
  <text x="1045" y="580" text-anchor="middle" class="small">Quotes / Bookings</text>

  <rect x="1220" y="510" width="260" height="105" class="node" filter="url(#shadow)"/>
  <text x="1350" y="555" text-anchor="middle" class="boxText">Support Layer</text>
  <text x="1350" y="580" text-anchor="middle" class="small">Reports / Support</text>

  <!-- Core flow -->
  <rect x="165" y="690" width="260" height="95" class="core" filter="url(#shadow)"/>
  <text x="295" y="730" text-anchor="middle" class="boxTitle">Create Request</text>
  <text x="295" y="758" text-anchor="middle" class="small">Describe service need</text>

  <rect x="470" y="690" width="260" height="95" class="core" filter="url(#shadow)"/>
  <text x="600" y="730" text-anchor="middle" class="boxTitle">View Pros</text>
  <text x="600" y="758" text-anchor="middle" class="small">Browse and compare</text>

  <rect x="775" y="690" width="260" height="95" class="core" filter="url(#shadow)"/>
  <text x="905" y="730" text-anchor="middle" class="boxTitle">Quote / Accept</text>
  <text x="905" y="758" text-anchor="middle" class="small">Provider quotes, customer accepts</text>

  <rect x="1080" y="690" width="270" height="95" class="core" filter="url(#shadow)"/>
  <text x="1215" y="730" text-anchor="middle" class="boxTitle">Booking &amp; Payment</text>
  <text x="1215" y="758" text-anchor="middle" class="small">Job begins + cash/online payment</text>

  <line x1="295" y1="785" x2="600" y2="785" class="arrowLine"/>
  <line x1="600" y1="785" x2="905" y2="785" class="arrowLine"/>
  <line x1="905" y1="785" x2="1215" y2="785" class="arrowLine"/>

  <!-- Decision and final -->
  <rect x="520" y="830" width="420" height="92" class="decisionBox" filter="url(#shadow)"/>
  <text x="730" y="872" text-anchor="middle" class="decision">Job Complete?</text>
  <text x="730" y="900" text-anchor="middle" class="small">Provider marks complete → customer confirms → payment completes</text>

  <line x1="730" y1="922" x2="730" y2="948" class="arrowLine"/>

  <rect x="580" y="948" width="300" height="52" class="node" filter="url(#shadow)"/>
  <text x="730" y="980" text-anchor="middle" class="boxTitle">Completed Booking</text>

  <!-- small support notes -->
  <text x="1030" y="175" text-anchor="left" class="small">Auth flow</text>
  <text x="1030" y="205" text-anchor="left" class="small">Profile, role switch, provider onboarding</text>
  <text x="1030" y="235" text-anchor="left" class="small">Reviews, chat, alerts, and support</text>
</svg>
