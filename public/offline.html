<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalLink - Offline</title>
  <style>
    :root {
      --color-navy: #1F2F55;
      --color-sage-light: #F4F8F5;
      --color-teal: #4A929B;
      --color-coral: #CD6B6B;
      --color-sage: #BDD1C3;
    }
    body {
      margin: 0;
      padding: 2rem 1.25rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--color-sage-light);
      color: var(--color-navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 1.5rem;
      border-radius: 1.5rem;
      border: 1px solid #DCE7E0;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(31, 47, 85, 0.08);
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #FBF1F1;
      color: var(--color-coral);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
      font-weight: 700;
    }
    p {
      color: #5c6b84;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      background: var(--color-teal);
      color: #fff;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 0.875rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>LocalLink needs an active internet connection to load new providers and live request updates. Please check your data or Wi-Fi connection.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
